# Compila el APK en cada push, ejecuta las pruebas y lo publica como release
# para poder descargarlo directamente desde el teléfono.
#
# Firma: si el repositorio tiene los secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS y KEY_PASSWORD, el APK optimizado se firma siempre con esa clave y
# las actualizaciones se instalan encima. Si no los tiene, se usa una clave
# temporal: el APK funciona igual, pero para instalar una compilación nueva hay
# que desinstalar la anterior.
name: Compilar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: datapath/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test datapath
        run: cd datapath && go test ./...

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            echo "::warning::Sin secretos de firma: se usa una clave temporal para esta compilación."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            KEY_ALIAS=shizzi
            keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Shizzi"
          fi
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify release signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | grep -v -- "-rc" | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/shizzi-mejorado.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/shizzi-mejorado-debug.apk
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: shizzi-mejorado
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Shizzi mejorado (compilación ${{ github.run_number }})" \
            --notes "APK compilado automáticamente desde ${{ github.ref_name }}. Instala **shizzi-mejorado.apk** (optimizado). Si algo no funciona, prueba **shizzi-mejorado-debug.apk**." \
            --prerelease

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties
